    --muted: #5b6f6b;

  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;

  }

  /* ── Layout ── */
  .app {
    display: flex;
    flex-direction: column;
    height: 100%;
    height: 100dvh;
  }

  /* ── Header ── */
  .topbar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: linear-gradient(135deg, var(--deep), #1a6b55);
    color: #fff;
    z-index: 1000;
    box-shadow: 0 2px 12px rgba(0,0,0,.18);
  }
  .topbar h1 {
    font-size: 15px;
    font-weight: 900;
    line-height: 1.2;
    flex: 1;
  }
  .topbar .sub {
    font-size: 10px;
    font-weight: 400;
    opacity: .8;
    display: block;
  }
  .topbar-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: rgba(255,255,255,.15);
    display: grid;
    place-items: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .legend-toggle {
    width: 36px; height: 36px;
    border-radius: 10px;
    border: none;
    background: rgba(255,255,255,.15);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
    transition: background .15s;
  }
  .legend-toggle:active { background: rgba(255,255,255,.3); }

  /* ── Filter Bar ── */
  .filter-bar {
    flex-shrink: 0;
    display: flex;
    gap: 6px;
    padding: 8px 12px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    background: #fff;
    border-bottom: 1px solid #e8ebe9;
    z-index: 999;
    scrollbar-width: none;
  }
  .filter-bar::-webkit-scrollbar { display: none; }

  .filter-chip {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 12px;
    border-radius: 20px;
    border: 2px solid;
    background: #fff;
    font: inherit;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: .15s;
    white-space: nowrap;
  }
  .filter-chip .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .filter-chip.active {
    color: #fff;
  }
  .filter-chip:not(.active) {
    opacity: .5;
  }

  /* ── Map ── */
  #map {
    flex: 1;
    z-index: 1;
  }

  /* ── Custom markers ── */
  .custom-marker {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
    border: 2.5px solid #fff;
    cursor: pointer;
    transition: transform .15s;
  }
  .custom-marker:hover {
    transform: rotate(-45deg) scale(1.15);
  }
  .custom-marker .marker-emoji {
    transform: rotate(45deg);
    font-size: 15px;
    line-height: 1;
  }
  .custom-marker.home-marker {
    width: 40px;
    height: 40px;
    border: 3px solid #fff;
    box-shadow: 0 3px 12px rgba(0,0,0,.35);
    z-index: 10 !important;
  }
  .custom-marker.home-marker .marker-emoji {
    font-size: 18px;
  }

  /* ── Bottom Sheet ── */
  .sheet-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.35);
    z-index: 2000;
    animation: fadeIn .2s;
  }
  .sheet-overlay.open { display: block; }

  .bottom-sheet {
    display: none;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    max-height: 70vh;
    background: #fff;
    border-radius: 20px 20px 0 0;
    z-index: 2001;
    box-shadow: 0 -4px 24px rgba(0,0,0,.15);
    overflow: hidden;
    animation: slideUp .25s ease-out;
  }
  .bottom-sheet.open { display: flex; flex-direction: column; }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .sheet-handle {
    flex-shrink: 0;
    display: flex;
    justify-content: center;
    padding: 10px 0 6px;
  }
  .sheet-handle::after {
    content: "";
    width: 36px; height: 4px;
    border-radius: 2px;
    background: #ccc;
  }

  .sheet-content {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 0 18px 24px;
  }

  .sheet-cat {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 10px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 8px;

  .sheet-name {
    font-size: 20px;
    font-weight: 900;
    color: var(--deep);
    line-height: 1.3;
    margin-bottom: 10px;
  }

  .sheet-meta {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .sheet-meta-item {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 6px 10px;
    border-radius: 8px;
    background: #f4f7f5;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
  }
  .sheet-meta-item .meta-icon {
    font-size: 14px;
  }

  .sheet-desc {
    font-size: 13px;
    line-height: 1.7;
    color: var(--ink);
    margin-bottom: 14px;
  }

  .sheet-detail {
    font-size: 12px;
    line-height: 1.65;
    color: var(--muted);
    padding: 12px 14px;
    border-radius: 10px;
    background: #f8faf9;
    border: 1px solid #e8ebe9;
  }

  .sheet-nav-btn {
    display: block;
    width: 100%;
    margin-top: 14px;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: var(--deep);
    color: #fff;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    text-decoration: none;
    text-align: center;
    transition: background .15s;
  }
  .sheet-nav-btn:active { background: #0e3a2e; }

  /* ── Spot Count ── */
  .spot-count {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    padding: 6px 14px;
    border-radius: 20px;
    background: rgba(29,42,43,.85);
    color: #fff;
    font-size: 11px;
    font-weight: 700;

    pointer-events: none;
    box-shadow: 0 2px 10px rgba(0,0,0,.2);

    .filter-bar { padding: 10px 20px; gap: 8px; justify-content: center; }
    .filter-chip { font-size: 12px; padding: 7px 16px; }
    .bottom-sheet { max-width: 420px; left: 50%; transform: translateX(-50%); border-radius: 20px 20px 0 0; }
    .sheet-overlay { backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  }
</style>

      description: "南ヶ丘牧場内。ジンギスカン・ハンバーグ。40名対応可。",
      detail: "3日目エリアAおすすめ。南ヶ丘牧場内にあるレストラン。ジンギスカン・ハンバーグ・カレーなど。40名まで団体対応可。牧場から移動不要で時間効率◎。",
      time: "約60分", cost: "1,000〜1,800円", day: "3日目",

      coords: [37.077000, 140.001800]
    },
    {
      id: "lunch-9", category: "🍽️ 昼食候補", emoji: "🍽️",
      name: "なすとらん（道の駅内）",
      shortName: "なすとらん",
      description: "道の駅内。那須和牛・地元野菜。112席。",
      detail: "道の駅 那須高原友愛の森の中にあるレストラン。那須和牛や地元野菜を使ったメニュー。112席で大人数でも入りやすい。",
      time: "約60分", cost: "1,300〜2,000円", day: "3日目",
      color: "#d35400",
      coords: [37.041000, 140.014200]
    }
  ];

  // ─── Category config ───
  const categories = [
    { key: "拠点", label: "🏠 宿泊先", color: "#f59e0b", emoji: "🏠" },
    { key: "カテゴリー1：牧場・体験系", label: "🐄 牧場・体験", color: "#e67e22", emoji: "🐄" },
    { key: "カテゴリー2：ミュージアム・アート系", label: "🎨 ミュージアム", color: "#8e44ad", emoji: "🎨" },
    { key: "カテゴリー3：お土産・グルメ系", label: "🛍️ お土産・グルメ", color: "#2980b9", emoji: "🛍️" },
    { key: "🍽️ 昼食候補", label: "🍽️ 昼食候補", color: "#d35400", emoji: "🍽️" }
  ];

  // ─── State ───
  const activeCategories = new Set(categories.map(c => c.key));
  const markers = [];

  // ─── Init Map ───
  const map = L.map('map', {
    center: [37.045, 140.00],
    zoom: 12,
    zoomControl: true,
    attributionControl: true
  });

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 18
  }).addTo(map);

  // ─── Create markers ───
  function createMarkerIcon(spot) {
    const isHome = spot.id === 'home';
    const div = document.createElement('div');
    div.className = 'custom-marker' + (isHome ? ' home-marker' : '');
    div.style.backgroundColor = spot.color;
    div.innerHTML = `<span class="marker-emoji">${spot.emoji}</span>`;
    return L.divIcon({
      html: div.outerHTML,
      className: '',
      iconSize: isHome ? [40, 40] : [34, 34],
      iconAnchor: isHome ? [20, 40] : [17, 34],
      popupAnchor: [0, -34]
    });
  }

  spots.forEach(spot => {
    const marker = L.marker(spot.coords, {
      icon: createMarkerIcon(spot),
      zIndexOffset: spot.id === 'home' ? 1000 : 0
    });
    marker._spotData = spot;
    marker.on('click', () => openSheet(spot));
    marker.addTo(map);
    markers.push(marker);
  });

  // ─── Filter bar ───
  const filterBar = document.getElementById('filterBar');
  categories.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'filter-chip active';
    btn.dataset.key = cat.key;
    btn.style.borderColor = cat.color;
    btn.style.backgroundColor = cat.color;
    btn.style.color = '#fff';
    btn.innerHTML = `<span class="dot" style="background:#fff"></span>${cat.label}`;

    btn.addEventListener('click', () => {
      if (activeCategories.has(cat.key)) {
        activeCategories.delete(cat.key);
        btn.classList.remove('active');
        btn.style.backgroundColor = '#fff';
        btn.style.color = cat.color;
        btn.querySelector('.dot').style.background = cat.color;
      } else {
        activeCategories.add(cat.key);
        btn.classList.add('active');
        btn.style.backgroundColor = cat.color;
        btn.style.color = '#fff';
        btn.querySelector('.dot').style.background = '#fff';
      }
      updateVisibility();
    });
    filterBar.appendChild(btn);
  });

  function updateVisibility() {
    let visibleCount = 0;
    markers.forEach(m => {
      const cat = m._spotData.category;
      if (activeCategories.has(cat)) {
        m.addTo(map);
        visibleCount++;
      } else {
        map.removeLayer(m);
      }
    });
    document.getElementById('spotCount').textContent =
      `表示中：${visibleCount} / ${spots.length} スポット`;
  }
  updateVisibility();

  // ─── Bottom Sheet ───
  const sheet = document.getElementById('sheet');
  const sheetContent = document.getElementById('sheetContent');
  const overlay = document.getElementById('sheetOverlay');

  function openSheet(spot) {
    const catConfig = categories.find(c => c.key === spot.category) || categories[0];
    const detailLines = spot.detail.split('\n').map(l => l.trim()).filter(Boolean);

    sheetContent.innerHTML = `
      <span class="sheet-cat" style="background:${spot.color}">${spot.category}</span>
      <h2 class="sheet-name">${spot.emoji} ${spot.name}</h2>
      <div class="sheet-meta">
        <div class="sheet-meta-item"><span class="meta-icon">⏱</span>${spot.time}</div>
        <div class="sheet-meta-item"><span class="meta-icon">💰</span>${spot.cost}</div>
        <div class="sheet-meta-item"><span class="meta-icon">📅</span>${spot.day}</div>
      </div>
      <p class="sheet-desc">${spot.description}</p>
      <div class="sheet-detail">${detailLines.join('<br>')}</div>
      <a class="sheet-nav-btn"
         href="https://www.google.com/maps/dir/?api=1&destination=${spot.coords[0]},${spot.coords[1]}&travelmode=driving"
         target="_blank" rel="noopener">
        📍 Google Mapsでナビを開く
      </a>
    `;
    sheet.classList.add('open');
    overlay.classList.add('open');
  }

  function closeSheet() {
    sheet.classList.remove('open');
    overlay.classList.remove('open');
  }

  overlay.addEventListener('click', closeSheet);

  // Swipe down to close
  let touchStartY = 0;
  sheet.addEventListener('touchstart', e => {
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  sheet.addEventListener('touchmove', e => {
    const dy = e.touches[0].clientY - touchStartY;
    if (dy > 60) closeSheet();
  }, { passive: true });

  // ─── Legend toggle: fit all visible markers ───
  document.getElementById('legendToggle').addEventListener('click', () => {
    const visible = markers.filter(m => map.hasLayer(m));
    if (visible.length) {
      const group = L.featureGroup(visible);
      map.fitBounds(group.getBounds().pad(0.08));
    }
  });

  // ─── Resize handler ───
  window.addEventListener('resize', () => map.invalidateSize());
})();
</script>
